name: Monthly HR News Update

on:
  schedule:
    - cron: '0 9 1 * *'   # 9:00 AM UTC on the 1st of every month
  workflow_dispatch:       # Allow manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests anthropic

      - name: Generate news page
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_news.py

      - name: Commit and push
        run: |
          git config --global user.email "news-bot@staffproinc.com"
          git config --global user.name "StaffPro News Bot"
          git add news.html news/
          git diff --staged --quiet || git commit -m "Monthly HR news update — $(date +'%B %Y')"
          git push
