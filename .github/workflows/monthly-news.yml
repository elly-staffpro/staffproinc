name: Monthly HR News Update

on:
  schedule:
    # 09:32 & 13:32 UTC on the 1st. Off the top of the hour (which GitHub drops
    # most often under load), and a second attempt a few hours later as a safety
    # net in case the first is skipped. The run is idempotent for the month.
    - cron: '32 9 1 * *'
    - cron: '32 13 1 * *'
  workflow_dispatch:       # Allow manual trigger from GitHub Actions tab
    inputs:
      force:
        description: >-
          Generate even if this month is already drafted or published. For a test
          run or to redo a month. Scheduled runs never set this, so the
          once-a-month guard still holds on the 1st.
        type: boolean
        default: false
      base:
        description: >-
          Branch the review PR targets. Leave as main to publish. Point it at dev
          to exercise the pipeline without proposing a change to the live site.
        type: string
        default: main
      suffix:
        description: >-
          Optional suffix for the branch name, so a test run cannot collide with
          the real draft branch for the same month.
        type: string
        default: ''

# pull-requests: write is what lets the bot open the review PR.
permissions:
  contents: write
  pull-requests: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out this month's branch and label
        id: month
        run: |
          suffix="${{ inputs.suffix }}"
          echo "branch=news-$(date -u +'%Y-%m')${suffix}" >> "$GITHUB_OUTPUT"
          echo "file=news/$(date -u +'%Y-%m').html" >> "$GITHUB_OUTPUT"
          echo "label=$(date -u +'%B %Y')"        >> "$GITHUB_OUTPUT"
          echo "base=${{ inputs.base || 'main' }}" >> "$GITHUB_OUTPUT"

      # Two crons fire each month, and the second must not redo the first's work
      # or spend another Claude/NewsAPI call. Skip if this month is already
      # drafted (branch exists) or already published (file is on main).
      - name: Skip if this month is already drafted or published
        id: guard
        run: |
          branch="${{ steps.month.outputs.branch }}"
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "force=true on a manual run — generating regardless."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "Branch $branch already exists — a draft is already open for review."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -f "${{ steps.month.outputs.file }}" ]; then
            echo "${{ steps.month.outputs.file }} is already on main — this month is published."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing for ${{ steps.month.outputs.label }} yet — generating."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.guard.outputs.skip == 'false'
        run: pip install requests anthropic

      - name: Generate news page
        if: steps.guard.outputs.skip == 'false'
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Candidate articles get written here so the review PR can show what
          # the stories were drawn from. Outside the repo, so it is never committed.
          NEWS_SOURCES_OUT: ${{ runner.temp }}/news-sources.md
        run: python scripts/generate_news.py

      # The bot no longer pushes to main. It opens a PR so a person reads the
      # month's stories before they are public. Merging the PR is what ships it.
      - name: Open a pull request for review
        if: steps.guard.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="${{ steps.month.outputs.branch }}"
          label="${{ steps.month.outputs.label }}"

          git config user.email "news-bot@staffproinc.com"
          git config user.name  "StaffPro News Bot"

          git checkout -b "$branch"
          git add news.html news/ sitemap.xml

          if git diff --staged --quiet; then
            echo "::warning::Generator produced no changes — no PR opened."
            exit 0
          fi

          git commit -m "Monthly HR news update — $label"
          git push origin "$branch"

          # Site Checks cannot start on this PR by themselves: GitHub does not let a
          # PR opened with the workflow's own token trigger other workflows (it is
          # how GitHub stops automations setting each other off in a loop). On the
          # October 2026 draft they simply never ran. So run them here, against the
          # pages this run just generated, and put the result at the top of the PR.
          checks_out="$RUNNER_TEMP/site-checks.txt"
          if python scripts/check_site.py > "$checks_out" 2>&1; then
            checks_ok=true
          else
            checks_ok=false
          fi
          cat "$checks_out"

          body_file="$RUNNER_TEMP/pr-body.md"
          cat > "$body_file" <<'BODY'
          Auto-generated by the monthly news workflow. **Nothing is public until this is merged.**

          Before merging, read each story and check that:

          - Every factual claim holds up. Each story ends with a "Source:" link -
            open it and check any date, dollar amount, threshold, effective date,
            agency name or case outcome against what the source actually says.
          - Federal Register and agency-newsroom stories are authoritative. Trade-press
            stories are second-hand, so treat those with more caution.
          - Nothing is wrong for New York or New Jersey specifically.
          - No story is stale, duplicated from last month, or off-topic for a PEO audience.
          - Nothing reads as legal advice.
          - The intro describes the stories that are actually here, and does not
            promise a topic that was cut.
          - No story is just a recurring statistic (weekly claims, monthly jobs
            numbers) dressed up as news.

          To publish: merge this PR. To discard: close it and delete the branch — the
          workflow will offer a fresh draft next month.
          BODY

          # Append the candidate articles, when the generator managed to write them.
          if [ -s "$RUNNER_TEMP/news-sources.md" ]; then
            cat "$RUNNER_TEMP/news-sources.md" >> "$body_file"
          else
            printf '\n_Source list unavailable for this run — verify each story manually._\n' >> "$body_file"
          fi

          # Top of the PR: the preview link, then the Site Checks result. A failure
          # goes in the title too, so it shows in the PR list and the email subject.
          preview="https://${branch}.staffproinc.pages.dev/news"
          head_file="$RUNNER_TEMP/pr-head.md"
          if [ "$checks_ok" = true ]; then
            title="Monthly HR news — $label"
            {
              printf '**Preview it as visitors will see it:** %s\n\n' "$preview"
              printf '**Site Checks: passed.** The generated pages were inspected before this draft was opened.\n\n---\n\n'
            } > "$head_file"
          else
            title="⚠️ CHECKS FAILED — Monthly HR news — $label"
            {
              printf '> ## ⚠️ Site Checks FAILED on this draft — do not merge\n'
              printf '> Merging would publish a page with the problems listed below. Ask for a fix, or close this PR.\n\n'
              printf '```\n'
              cat "$checks_out"
              printf '```\n\n'
              printf '**Preview:** %s\n\n---\n\n' "$preview"
            } > "$head_file"
          fi
          cat "$head_file" "$body_file" > "$body_file.new"
          mv "$body_file.new" "$body_file"

          gh pr create \
            --base "${{ steps.month.outputs.base }}" \
            --head "$branch" \
            --title "$title" \
            --body-file "$body_file"

          echo "Opened PR for $label."

          # The draft is open either way, so nothing is lost — but a failed check
          # also turns this run red in the Actions tab.
          if [ "$checks_ok" != true ]; then
            echo "::error::Site Checks failed on the generated pages. The PR is marked CHECKS FAILED."
            exit 1
          fi
